<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dental Chatbot Demo</title>
    <style>
        /* --- Base styles --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        #framer-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 0;
        }

        /* --- Chat widget --- */
        #chat-widget {
            position: fixed;
            bottom: 70px;
            right: 20px;
            z-index: 1000;
        }

        #chat-bubble {
            width: 65px;
            height: 65px;
            background: #0077cc;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            transition: transform 0.2s ease;
        }

        #chat-bubble:hover { transform: scale(1.1); }

        #chat-box {
            width: 320px;
            height: 420px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        #messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* User bubble */
        #messages .user {
            align-self: flex-end;
            background: #0077cc;
            color: white;
            padding: 8px 12px;
            border-radius: 16px 16px 4px 16px;
            max-width: 80%;
            animation: slideInRight 0.3s ease;
        }

        /* AI bubble */
        #messages .ai {
            align-self: flex-start;
            background: #f1f1f1;
            color: #333;
            padding: 8px 12px;
            border-radius: 16px 16px 16px 4px;
            max-width: 80%;
            animation: slideInLeft 0.3s ease;
        }

        #chat-input {
            border: none;
            border-top: 1px solid #ddd;
            padding: 12px;
            width: calc(100% - 24px);
            margin: 0 12px;
            border-radius: 4px;
            outline: none;
        }

        #send-btn {
            margin: 10px;
            background: #0077cc;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        #send-btn:hover { background: #005fa3; }

        #powered {
            font-size: 0.75em;
            color: #999;
            text-align: center;
            margin: 6px 0;
        }

        /* Typing indicator bubble */
        .typing {
            align-self: flex-start;
            background: #f1f1f1;
            padding: 10px 14px;
            border-radius: 16px 16px 16px 4px;
            display: inline-flex;
            gap: 4px;
        }

        /* Animated dots */
        .typing span {
            width: 6px;
            height: 6px;
            background: #888;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

<!-- Framer site as full-page iframe -->
<iframe id="framer-iframe" src="https://alive-object-455176.framer.app"></iframe>

<!-- Chat widget -->
<div id="chat-widget">
    <div id="chat-bubble">💬</div>
    <div id="chat-box">
        <div id="messages"></div>
        <input id="chat-input" placeholder="Type your message..." />
        <button id="send-btn">Send</button>
        <div id="powered">Powered by DentalChat Assistant</div>
    </div>
</div>

<script>
    const bubble = document.getElementById("chat-bubble");
    const box = document.getElementById("chat-box");
    const messages = document.getElementById("messages");
    const input = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");

    // Toggle chat box
    bubble.addEventListener("click", () => box.style.display = box.style.display === "none" ? "flex" : "none");

    // Backend URL
    const BACKEND_URL = "https://dentalchat-alpha.vercel.app/api/chat";

    // Send message
    sendBtn.addEventListener("click", async () => {
        const text = input.value.trim();
        if (!text) return;

        // Add user bubble
        const userDiv = document.createElement("div");
        userDiv.className = "user";
        userDiv.textContent = `You: ${text}`;
        messages.appendChild(userDiv);
        input.value = "";
        messages.scrollTop = messages.scrollHeight;

        try {
            const res = await fetch(BACKEND_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();

            // Add AI bubble
            const aiDiv = document.createElement("div");
            aiDiv.className = "ai";
            aiDiv.textContent = `Assistant: ${data.reply}`;
            messages.appendChild(aiDiv);
            messages.scrollTop = messages.scrollHeight;
        } catch (err) {
            const errDiv = document.createElement("div");
            errDiv.className = "ai";
            errDiv.style.color = "red";
            errDiv.textContent = "Assistant: Error connecting to backend";
            messages.appendChild(errDiv);
            messages.scrollTop = messages.scrollHeight;
        }
    });

    // Optional: Enter key sends message
    input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendBtn.click();
    });
</script>

</body>
</html>
